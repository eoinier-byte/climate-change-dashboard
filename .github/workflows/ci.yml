name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Install the pipeline's packages
      - run: pip install -r requirements.txt
      # Check every script has no syntax errors (the data files aren't on GitHub, so we can't run them)
      - run: python -m compileall -q .
      # Run the pipeline tests (CCD-100, CCD-275, CCD-36)
      - run: python -m pytest tests -v

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ccd
          POSTGRES_USER: ccd
          POSTGRES_PASSWORD: ccd
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    # Same keys as the root .env (there is no .env on the runner)
    env:
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: ci-only-not-secret
      DB_NAME: ccd
      DB_USER: ccd
      DB_PASSWORD: ccd
      DB_HOST: localhost
      DB_PORT: "5432"
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      # Only run the rest once the backend exists (hashFiles works at step level)
      - uses: actions/setup-python@v5
        if: ${{ hashFiles('backend/manage.py') != '' }}
        with:
          python-version: "3.12"
      - if: ${{ hashFiles('backend/manage.py') != '' }}
        run: pip install -r requirements.txt
      - if: ${{ hashFiles('backend/manage.py') != '' }}
        run: python manage.py test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      # Only run the rest once the frontend exists
      - uses: actions/setup-node@v4
        if: ${{ hashFiles('frontend/package.json') != '' }}
        with:
          node-version: "22"
      - if: ${{ hashFiles('frontend/package.json') != '' }}
        run: npm ci
      - if: ${{ hashFiles('frontend/package.json') != '' }}
        run: npm run build
      - if: ${{ hashFiles('frontend/package.json') != '' }}
        run: npm test --if-present