name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Python lint (CCD-277): the same ruff checks as the pre-commit hook,
  # so code that skipped the hook on someone's machine still gets caught here
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Same ruff version as .pre-commit-config.yaml
      - run: pip install ruff==0.16.10
      # Report lint errors (unused imports, import order, etc.)
      - run: ruff check .
      # Fail if any file is not formatted (run "pre-commit run --all-files" locally to fix)
      - run: ruff format --check .

  pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Install the pipeline's packages
      - run: pip install -r requirements.txt
      # Check every script has no syntax errors (the data files aren't on GitHub, so we can't run them)
      - run: python -m compileall -q .
      # Run the pipeline tests (CCD-100, CCD-275, CCD-36)
      - run: python -m pytest tests -v

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ccd
          POSTGRES_USER: ccd
          POSTGRES_PASSWORD: ccd
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    # Same keys as the root .env (there is no .env on the runner)
    env:
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: ci-only-not-secret
      DB_NAME: ccd
      DB_USER: ccd
      DB_PASSWORD: ccd
      DB_HOST: localhost
      DB_PORT: "5432"
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      # Only run the rest once the backend exists (hashFiles works at step level)
      - uses: actions/setup-python@v5
        if: ${{ hashFiles('backend/manage.py') != '' }}
        with:
          python-version: "3.12"
      - if: ${{ hashFiles('backend/manage.py') != '' }}
        run: pip install -r requirements.txt
      - if: ${{ hashFiles('backend/manage.py') != '' }}
        run: python manage.py test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      # Only run the rest once the frontend exists
      - uses: actions/setup-node@v4
        if: ${{ hashFiles('frontend/package.json') != '' }}
        with:
          node-version: "22"
      - if: ${{ hashFiles('frontend/package.json') != '' }}
        run: npm ci
      - if: ${{ hashFiles('frontend/package.json') != '' }}
        run: npm run lint
      - if: ${{ hashFiles('frontend/package.json') != '' }}
        run: npm run build
      - if: ${{ hashFiles('frontend/package.json') != '' }}
        run: npm test --if-present

  # C++ flood module (CCD-277): only runs once the module exists.
  # The C++ code lives in flood_engine/ (CCD-396); the tests use Catch2, which CMake downloads.
  cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Python for the pybind11 binding (CCD-399): headers to build it, numpy + pytest to test it
      - uses: actions/setup-python@v5
        if: ${{ hashFiles('flood_engine/CMakeLists.txt') != '' }}
        with:
          python-version: "3.12"
      - if: ${{ hashFiles('flood_engine/CMakeLists.txt') != '' }}
        run: pip install numpy pytest
      # Configure and build with CMake (cmake and g++ come pre-installed on the runner).
      # Python_EXECUTABLE makes CMake use the setup-python interpreter, not the system one.
      - if: ${{ hashFiles('flood_engine/CMakeLists.txt') != '' }}
        run: >-
          cmake -S flood_engine -B flood_engine/build
          -DFLOOD_ENGINE_BUILD_PYTHON=ON -DPython_EXECUTABLE="$(which python)"
      - if: ${{ hashFiles('flood_engine/CMakeLists.txt') != '' }}
        run: cmake --build flood_engine/build
      # Run the C++ tests registered with CTest
      - if: ${{ hashFiles('flood_engine/CMakeLists.txt') != '' }}
        run: ctest --test-dir flood_engine/build --output-on-failure
      # Run the Python binding tests against the module just built
      - if: ${{ hashFiles('flood_engine/CMakeLists.txt') != '' }}
        env:
          FLOOD_ENGINE_PY_DIR: ${{ github.workspace }}/flood_engine/build/python
        run: python -m pytest flood_engine/tests/python -v
      # Flood precompute (CCD-400): run its tests with the real binding, so the end-to-end test
      # (skipped in the pipeline job, which has no binding) really runs. Synthetic inputs only.
      - if: ${{ hashFiles('flood_engine/CMakeLists.txt') != '' }}
        run: pip install -r pipeline/requirements.txt
      - if: ${{ hashFiles('flood_engine/CMakeLists.txt') != '' }}
        working-directory: pipeline
        env:
          FLOOD_ENGINE_PY_DIR: ${{ github.workspace }}/flood_engine/build/python
        run: python -m pytest tests/test_flood_precompute.py -v

  # Failure alerts (CCD-279): post to the team's Discord channel if any job above fails.
  # Needs a repo secret called DISCORD_WEBHOOK_URL (see docs/ci-cd.md).
  notify:
    runs-on: ubuntu-latest
    needs: [lint, pipeline, backend, frontend, cpp]
    # failure() is true when any job in "needs" failed
    if: ${{ failure() }}
    steps:
      - name: Send Discord message
        # Values go in through env, not straight into the script, so a branch name can't inject shell code
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Build the message, then send it as JSON to the Discord webhook
          MESSAGE="CI failed on branch $BRANCH (pushed by $ACTOR). Details: $RUN_URL"
          curl -sS -H "Content-Type: application/json" \
            -d "{\"content\": \"$MESSAGE\"}" \
            "$WEBHOOK"