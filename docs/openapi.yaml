  /api/counties/{slug}/analogues/:
    get:
      operationId: counties_analogues_list
      description: The 3 European cities whose present climate (WorldClim 2.1, 1970-2000)
        is closest to the county's projected climate for one scenario and period,
        ordered by rank (1 = closest). CCD-358.
      summary: Climate analogues of a county
      parameters:
      - in: query
        name: period
        schema:
          type: string
          enum:
          - 2021-2050
          - 2071-2100
        description: |-
          * `2021-2050` - 2021-2050
          * `2071-2100` - 2071-2100
        required: true
      - in: query
        name: scenario
        schema:
          type: string
          enum:
          - rcp26
          - rcp45
          - rcp85
        description: |-
          * `rcp26` - RCP2.6
          * `rcp45` - RCP4.5
          * `rcp85` - RCP8.5
        required: true
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - counties
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CountyAnalogue'
          description: ''
        '400':
          description: scenario or period missing or invalid (baseline is not valid)
        '404':
          description: Unknown county
