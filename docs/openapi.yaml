components:
  schemas:
    Avatar:
      type: object
      properties:
        avatar:
          type: string
          format: uri
          pattern: (?:jpg|jpeg|png|heic|heif)$
      required:
      - avatar
    Chat:
      type: object
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
        context:
          $ref: '#/components/schemas/PageContext'
      required:
      - messages
    ChatMessage:
      type: object
      properties:
        role:
          $ref: '#/components/schemas/RoleEnum'
        content:
          type: string
          maxLength: 4000
      required:
      - content
      - role
    ClimateProjection:
      type: object
      properties:
        scenario:
          type: string
          readOnly: true
        baseline_period:
          type: string
          readOnly: true
        units:
          type: string
          readOnly: true
        source:
          type: string
          readOnly: true
        value:
          type: string
          format: decimal
          pattern: ^-?\d{0,5}(?:\.\d{0,3})?$
        county:
          type: string
          readOnly: true
        period:
          type: string
          maxLength: 9
        season:
          $ref: '#/components/schemas/SeasonEnum'
        baseline_value:
          type: string
          format: decimal
          pattern: ^-?\d{0,5}(?:\.\d{0,3})?$
          readOnly: true
        projected_value:
          type: string
          format: decimal
          pattern: ^-?\d{0,5}(?:\.\d{0,3})?$
          readOnly: true
        change:
          type: number
          format: double
          nullable: true
          readOnly: true
        variable:
          $ref: '#/components/schemas/VariableEnum'
      required:
      - baseline_period
      - baseline_value
      - change
      - county
      - period
      - projected_value
      - scenario
      - season
      - source
      - units
      - value
      - variable
    County:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 50
        slug:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        has_coastline:
          type: boolean
      required:
      - id
      - name
      - slug
    CountyAnalogue:
      type: object
      description: One row of GET /counties/{slug}/analogues/ (CCD-358), shape agreed
        in docs/api-examples.md.
      properties:
        county:
          type: string
          readOnly: true
        scenario:
          $ref: '#/components/schemas/ScenarioEnum'
        period:
          type: string
          maxLength: 9
        rank:
          type: integer
          maximum: 32767
          minimum: 0
        city:
          type: string
