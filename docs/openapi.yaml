openapi: 3.0.3
info:
  title: ''
  version: 0.0.0
paths:
  /api/agent/chat/:
    post:
      operationId: agent_chat_create
      tags:
      - agent
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Chat'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Chat'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Chat'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: 'application/x-ndjson stream, one JSON event per line: {"type":
            "tool", "name", "input"} while data is looked up, {"type": "text", "text"}
            for each piece of the answer, {"type": "done", "sources": [{"name", "url"}]}
            at the end, or {"type": "error", "text"} if the answer could not be finished.'
        '400':
          description: Invalid messages or context.
        '429':
          description: Over the chat limit.
